<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Arsip Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 min-h-screen">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Input Arsip Project</h1>
        
        <form id="arsipForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Dokumen</label>
                <input type="date" id="tanggal" required class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kategori Dokumen</label>
                <select id="kategori" required class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500" onchange="toggleNominal()">
                    <option value="Operasional / SOP">Operasional / SOP</option>
                    <option value="Pengeluaran / Kuitansi">Pengeluaran / Kuitansi</option>
                    <option value="Lainnya" selected>Lainnya</option>
                </select>
            </div>

            <div id="nominalContainer" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label>
                <input type="number" id="nominal" class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan / Nama Item</label>
                <input type="text" id="keterangan" required class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Upload File</label>
                <input type="file" id="dokumen" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700" />
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Simpan Arsip
            </button>
        </form>
    </div>

    <script>
        // MASUKKAN URL DEPLOYMENT BARU ANDA DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRtnNtntdNdXU2sbIeL7M8TZ-4RMMgrD54Pym2qm12ty1W6YNJ8r0gJFGYWOnBUyoZ/exec";

        function toggleNominal() {
            const kategori = document.getElementById("kategori").value;
            const nominalContainer = document.getElementById("nominalContainer");
            if (kategori === "Pengeluaran / Kuitansi") {
                nominalContainer.classList.remove("hidden");
                document.getElementById("nominal").required = true;
            } else {
                nominalContainer.classList.add("hidden");
                document.getElementById("nominal").required = false;
                document.getElementById("nominal").value = "";
            }
        }

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        document.getElementById("arsipForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";

            try {
                let fileBase64 = "", fileName = "", mimeType = "";
                const fileInput = document.getElementById("dokumen");

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    fileBase64 = await getBase64(file);
                    fileName = new Date().getTime() + "_" + file.name;
                    mimeType = file.type;
                }

                const payload = {
                    tanggal: document.getElementById("tanggal").value,
                    kategori: document.getElementById("kategori").value,
                    keterangan: document.getElementById("keterangan").value,
                    nominal: document.getElementById("nominal").value,
                    fileBase64, fileName, mimeType
                };

                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === "error") {
                    alert("Gagal menyimpan ke Sheet: " + result.message);
                } else {
                    alert("Sukses! Data tersimpan di Spreadsheet.");
                    document.getElementById("arsipForm").reset();
                    toggleNominal();
                }
            } catch (error) {
                alert("Error Jaringan/Sistem: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Simpan Arsip";
            }
        });
    </script>
</body>
</html>
